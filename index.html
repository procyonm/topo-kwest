h1 span{color:var(--hit)}
.sub{color:var(--ink-dim);font-size:14px;margin:4px 0 0}
.iconbtn{background:none;border:1px solid var(--line);color:var(--ink-dim);border-radius:8px;padding:6px 10px;font:700 13px var(--body);cursor:pointer}
.game{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr);gap:16px}

  .sub{display:none}
  .card{padding:12px;gap:8px}
  .stat{padding:4px 8px} .stat b{font-size:20px}
  .opt{min-height:44px;padding:8px;font-size:16px}
  .note{display:none}
  .menu .note{display:block}
}

svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.prov{fill:var(--land);stroke:var(--border);stroke-width:1.4;stroke-linejoin:round;transition:fill .15s}
.prov:nth-child(odd){fill:var(--land-alt)}
.clickable .prov{cursor:pointer}

.prov.hl{fill:var(--hit)!important}

.prov.bad{fill:var(--bad)!important}
.prov.answer{animation:pulse .5s ease-in-out 3 alternate}

.dot{fill:var(--dot);stroke:#fff;stroke-width:2}
.dot.deco{opacity:.6}
.dot.hl{fill:var(--hit);stroke:#000}
.dot.water{fill:#2f7bff}
.dot.place{fill:#3ee06c}
.river{fill:none;stroke:#2f7bff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.river.hl{stroke:#ffd83d;stroke-width:7}
.sb text{font-family:var(--body);font-weight:900;pointer-events:none}
.sb .code{fill:#fff;text-anchor:middle;dominant-baseline:central}
.sb .sname{fill:#fff;stroke:#000;stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.sb.g-prov .sname{fill:#ffd83d}
.nonames .sb .sname{display:none}
.sb .shape{stroke:#fff;stroke-width:1.5px;vector-effect:non-scaling-stroke}
.sb.on .shape{stroke:#ffd83d;stroke-width:5px}

.legend{display:flex;flex-direction:column;gap:6px}
.legend .row{display:flex;flex-wrap:wrap;gap:6px}
.key{display:flex;align-items:center;gap:8px;font:800 15px var(--body);color:#fff;text-shadow:2px 2px 0 #3f3f3f;background:rgba(0,0,0,.3);border:2px solid #000;padding:5px 9px;cursor:pointer;min-height:40px}
.key.on{border-color:var(--hit);background:rgba(255,216,61,.25)}
.key i{font-style:normal;display:inline-grid;place-items:center;min-width:24px;height:24px;font-weight:900;font-size:14px;color:#fff;text-shadow:none;border:1px solid #fff}
.key i.prov{background:#111;border-radius:50%} .key i.city{background:#111} .key i.place{background:#2e9e4f} .key i.water{background:#2f7bff;border-radius:50%}
#hud{grid-template-columns:1fr 1fr auto}
.stopbtn{font-size:15px;padding:0 14px;min-height:0}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.8);border:3px solid var(--hit);padding:8px 14px;color:#fff;font-weight:900;animation:toast 2.6s ease forwards;pointer-events:none}
.toast svg{width:54px;height:48px}
.toast span{display:flex;flex-direction:column;font-size:13px;color:var(--hit)} .toast b{font-size:18px;color:#fff}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;background:rgba(0,0,0,.3);border:3px solid #000;cursor:pointer;color:#fff;font:800 14px var(--body);text-shadow:2px 2px 0 #3f3f3f}
.sw svg{width:56px;height:56px;border:2px solid #000}
.sw.on{border-color:var(--hit);background:rgba(255,216,61,.25)}
.building .prov{cursor:pointer}
.prov.pick{stroke:#ffd83d!important;stroke-width:6!important;filter:brightness(1.15)}
.key i.dotkey{min-width:16px;width:16px;height:16px;border-radius:50%;background:var(--dot);border:2px solid #000}
.key i.dotkey.water{background:#2f7bff} .key i.dotkey.place{background:#3ee06c}
.sb .shape.dot{stroke:#000;stroke-width:2.5px}
.sb.on .shape.dot{fill:var(--hit);stroke:#000;stroke-width:3px}
.ring{fill:none;stroke:var(--hit);stroke-width:4}
.ring.good{stroke:var(--good)} .ring.bad{stroke:var(--bad)}
.ring.blink{animation:blink .35s steps(2) 5}
@keyframes blink{50%{opacity:0}}
.sealabel{fill:#6d93b3;font:italic 700 15px var(--body);letter-spacing:3px}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0;overflow:auto}
.hud{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{color:var(--ink-dim);font-size:11px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.combo{color:var(--hit)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qnum{color:var(--ink-dim);font-size:12px;text-transform:uppercase;letter-spacing:1.4px;font-weight:900}
.q{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,32px);line-height:1.15;margin:0;text-wrap:balance}
.q em{font-style:normal;color:var(--hit)}
.bonus{display:flex;align-items:center;gap:8px;color:var(--ink-dim);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px}
.timer{flex:1;height:5px;background:var(--sea-deep);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--ink-dim);opacity:.6;transform-origin:left}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt,.big{font:900 17px var(--body);color:var(--sea-deep);background:var(--land);border:none;border-bottom:4px solid var(--border);border-radius:10px;padding:12px 10px;cursor:pointer;min-height:52px}
.opt:active,.big:active{transform:translateY(2px);border-bottom-width:2px}
.opt.good{background:var(--good)} .opt.bad{background:var(--bad);color:#fff}
.big{background:var(--hit);border-bottom-color:#b8860b;font-size:19px;width:100%}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);border-bottom-width:4px}
button:focus-visible,.prov:focus-visible{outline:3px solid var(--hit);outline-offset:2px}
.feedback{min-height:24px;font-weight:900;font-size:17px}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--hit)}
.levels{display:flex;flex-direction:column;gap:10px}
.donebox summary{cursor:pointer;color:var(--good);font-weight:900;font-size:14px;padding:6px 0;list-style-position:inside}
.donebox .levels{margin-top:8px}
.lvl.done{opacity:.6;border-style:dashed}
.lvl.done .n{color:var(--good)}
.trophyrow{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.25);border:3px solid #000;padding:8px 10px}

.trophyrow .locked{filter:grayscale(1) brightness(.7);opacity:.6}
.trophyrow b{display:block;font-size:15px;text-shadow:2px 2px 0 #3f3f3f}
.trophyrow .pips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.trophyrow .pips span{font-size:11px;font-weight:900;padding:2px 6px;border:2px solid #000;background:#4a4a4a;color:#bbb}
.trophyrow .pips span.on{background:var(--good);color:#063}
.trophyrow.won{border-color:var(--hit);background:rgba(255,216,61,.18)}
.bigtrophy{text-align:center}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.slot{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px 4px;background:rgba(0,0,0,.3);border:3px solid #000;box-shadow:inset 0 -6px 0 #6e4a28}

.slot .locked{filter:grayscale(1) brightness(.35)}
.slot b{font-size:15px;line-height:1.15;text-shadow:2px 2px 0 #3f3f3f}
.slot small{font-size:11px;color:#ddd;line-height:1.2}
.slot.got{border-color:var(--hit)}
.newtro{display:flex;flex-wrap:wrap;gap:8px}
.newtro div{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.3);border:2px solid var(--hit);padding:4px 8px;font-weight:900}
.newtro svg{width:48px;height:43px}
.cabbtn{display:flex;align-items:center;justify-content:center;gap:10px}
.cabbtn svg{width:44px;height:40px}
.bigtrophy svg{width:150px;height:136px;margin:0 auto;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.5));animation:bob 1s ease-in-out infinite alternate}

.bigtrophy .q{color:var(--hit);text-shadow:3px 3px 0 #3f3a00}

.lvl .n{font-family:var(--display);font-size:26px;color:var(--hit);text-align:center}

.lvl small{color:var(--ink-dim)}

.helpb{font:800 14px var(--body);color:var(--ink);background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;min-height:40px}
.helpb:disabled{opacity:.45;cursor:default}
.zen .helpb{background:#f4f7f6;color:#2f3d45;border:1px solid #cfdadd} .zen .tokchip{color:#8a6fc9;border-color:#cfdadd}
.atlas .tokchip{color:#2f6fb3}
.shopitem{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.shopitem .ic{font-size:28px;text-align:center}
.shopitem strong{display:block;font-size:17px} .shopitem small{display:block;color:var(--ink-dim)}
.shopitem .opt{min-height:44px;padding:6px 12px;font-size:15px}
.shopitem .opt:disabled{opacity:.45;cursor:default}
.zen .shopitem{background:#f4f7f6;border:1px solid #cfdadd;color:#2f3d45} .zen .shopitem small{color:#5d6f78}
.opt.gone{visibility:hidden}
@media (max-width:760px){
  .card.writing .lvprog,.card.writing .qnum{display:none}
  .card.writing .q{font-size:21px}
  .wrap.typing header,.wrap.typing .hud{display:none}
  .wrap.typing .panel{max-height:none}
}

  return {id:"toets-"+region, get title(){ return t("toetsTitle", rl(rk)); }, toets:true, kind:"mix", view:R.view, parts,
    get desc(){ return t("toetsDesc", R.provs, R.islands.length, !!R.cities); }};
}

let soundOn = true, ac = null;
function beep(freqs, dur=0.09){
  if(!soundOn) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+i*dur;
      o.type="square"; o.frequency.value=f; g.gain.setValueAtTime(.06,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur);
    });
  }catch(e){}
}

function getAC(){ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); return ac; }
function blip(a, t, freq, end, dur, vol, type){
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t); o.frequency.exponentialRampToValueAtTime(end,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.01);
}
function tick(a, t, hz, dur, vol){
  const len=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,6);
  const n=a.createBufferSource(); n.buffer=buf;
  const f=a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hz;
  const g=a.createGain(); g.gain.value=vol;
  n.connect(f).connect(g).connect(a.destination); n.start(t);
}

function click(){
  if(!soundOn) return;
  try{
    const a=getAC(), t=a.currentTime;
    tick(a, t, 3000, .006, .9);
    blip(a, t, 1150, 900, .022, .22, "square");
    tick(a, t+.014, 2200, .005, .5);
    blip(a, t+.014, 820, 700, .018, .12, "square");
  }catch(e){}
}

function ding(){
  if(!soundOn) return;
  try{
    const a=getAC(), t=a.currentTime, p=0.6+Math.random()*0.8, f=1250*p;
    [[f,.16],[f*2.01,.05],[f*3.0,.02]].forEach(([fr,v])=>{
      const o=a.createOscillator(), g=a.createGain();
      o.type="sine"; o.frequency.value=fr;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+.35);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t+.4);
    });
  }catch(e){}
}

function boom(){
  if(!soundOn) return;
  try{
    const a=getAC(), t=a.currentTime, len=Math.floor(a.sampleRate*.7);
    const buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
    const n=a.createBufferSource(); n.buffer=buf;
    const f=a.createBiquadFilter(); f.type="lowpass"; f.frequency.setValueAtTime(1800,t); f.frequency.exponentialRampToValueAtTime(120,t+.6);
    const g=a.createGain(); g.gain.value=.55;
    n.connect(f).connect(g).connect(a.destination); n.start(t);
    blip(a,t,120,40,.35,.4,"sine");
  }catch(e){}
}

function strike(){
  if(!soundOn) return;
  try{
    const a=getAC(), t=a.currentTime, len=Math.floor(a.sampleRate*.28);
    const buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/len);
    const n=a.createBufferSource(); n.buffer=buf;
    const f=a.createBiquadFilter(); f.type="bandpass"; f.Q.value=3; f.frequency.setValueAtTime(5000,t); f.frequency.exponentialRampToValueAtTime(500,t+.25);
    const g=a.createGain(); g.gain.value=.5; n.connect(f).connect(g).connect(a.destination); n.start(t);
    blip(a, t+.05, 1600, 180, .16, .1, "sawtooth");
    blip(a, t+.16, 110, 38, .45, .6, "sine");
    blip(a, t+.16, 220, 70, .25, .18, "square");
    [440, 466].forEach(fr => blip(a, t+.17, fr, fr*.98, .6, .05, "triangle"));

    const splat = (at, vol, dur) => {
      const l=Math.floor(a.sampleRate*dur), bb=a.createBuffer(1,l,a.sampleRate), dd=bb.getChannelData(0);
      let blob=0;
      for(let i=0;i<l;i++){ if(Math.random()<.004) blob=1; blob*=.996;
        dd[i]=(Math.random()*2-1)*(.35+blob)*Math.pow(1-i/l,1.6); }
      const nn=a.createBufferSource(); nn.buffer=bb;
      const bp=a.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=1.4;
      bp.frequency.setValueAtTime(1300,at); bp.frequency.exponentialRampToValueAtTime(350,at+dur);
      const gg=a.createGain(); gg.gain.value=vol; nn.connect(bp).connect(gg).connect(a.destination); nn.start(at);
      blip(a, at, 160, 50, .12, vol*.7, "sine");
    };

    splat(t+.6, 1.0, .28);
    splat(t+.67, .45, .18);
    blip(a, t+.95, 650, 1100, .06, .05, "sine");
  }catch(e){}
}

  add("flash",`left:${x}px;top:${y}px`);

    add("puff",`left:${x}px;top:${y}px;--s:${14+Math.random()*16}px;--dx:${Math.cos(an)*d}px;--dy:${Math.sin(an)*d-20}px`); }

}

function chime(){
  if(!soundOn) return;
  try{
    const a=getAC(), t=a.currentTime;
    [[528,.09],[792,.04],[1056,.02]].forEach(([fr,v])=>{
      const o=a.createOscillator(), g=a.createGain(); o.type="sine"; o.frequency.value=fr;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+2.2);

}

const cleanSpell = s => s.normalize("NFC").replace(/[’‘`´ʼ′]/g,"'").replace(/[‐‑‒–—]/g,"-").replace(/\s+/g," ").trim();
const normSpell = cleanSpell;

function spellRules(given, want){
  const g = cleanSpell(given), out = [];
  if(want.startsWith("'") && !g.startsWith("'")) out.push(t("r_apos", want));
  else if(!want.includes("'") && g.includes("'")) out.push(t("r_noApos"));
  if(want.includes("-") && (!g.includes("-") || / -|- /.test(g))) out.push(t("r_dash", want));
  else if(!want.includes("-") && g.includes("-")) out.push(t("r_noDash"));
  const bare = x => x.replace(/^'s-?/i, ""), gp = bare(g).split(/[- ]+/), wp = bare(want).split("-");
  const capOff = gp.length===wp.length && wp.some((w,i) => gp[i] && gp[i][0] && gp[i][0]!==w[0] && gp[i][0].toLowerCase()===w[0].toLowerCase());
  const sOff = want.startsWith("'s") && (/^'S/.test(g) || capOff);
  if(sOff) out.push(t("r_capsS", want));
  else if(capOff) out.push(t(wp.length>1 ? "r_capsDash" : "r_caps1", want));
  else if(g!==want && g.toLowerCase()===want.toLowerCase()) out.push(t("r_capsIn", want));
  return out;
}
const escH = c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c] || c);

function spellDiff(given, want){
  const A = [...cleanSpell(given)], B = [...want], a = A, b = B;
  const n = a.length, m = b.length, d = Array.from({length:n+1}, (_, i) => Array(m+1).fill(0));
  for(let i=0;i<=n;i++) d[i][0]=i; for(let j=0;j<=m;j++) d[0][j]=j;
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  const badA = Array(n).fill(false), badB = Array(m).fill(false); let i = n, j = m;
  while(i>0 || j>0){
    if(i>0 && j>0 && d[i][j]===d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){ if(a[i-1]!==b[j-1]) badA[i-1] = badB[j-1] = true; i--; j--; }
    else if(i>0 && d[i][j]===d[i-1][j]+1){ badA[i-1] = true; i--; }
    else { badB[j-1] = true; j--; }
  }
  const mk = (C, bad) => C.map((c,k) => bad[k] ? `<mark>${c===" " ? "␣" : escH(c)}</mark>` : c===" " ? "&nbsp;" : escH(c)).join("");
  return {dist:d[n][m], want:mk(B, badB), yours:mk(A, badA)};
}

function writeQuestions(level, only){
  const items = level.parts.flatMap(([k,p]) => p.map(x => ({kind:k, name: typeof x==="string"?x:x.name, pool:p})));
  if(only) return shuffle(items.filter(q => only.includes(q.name))).map(q => ({...q, type:"write"}));
  const seen = load("topo-write") || {};
  const pick = shuffle(items).sort((x,y) => (seen[x.name]||0) - (seen[y.name]||0)).slice(0, WRITE_N);
  const now = Date.now(); pick.forEach(q => seen[q.name] = now); save("topo-write", seen);
  return shuffle(pick).map(q => ({...q, type:"write"}));
}

function buildQuestions(level, only){
  if(level.write) return writeQuestions(level, only);
  let items = [];
  const add = (kind, pool) => pool.forEach(x => items.push({kind, name: typeof x==="string"?x:x.name, pool}));
  if(level.parts) level.parts.forEach(([k,p]) => add(k,p));
  else if(level.kind==="mix"){ add("prov",LEVELS[1].pool); add("dot",CAPITALS); add("dot",ISLANDS); }
  else add(level.kind, level.pool);
  if(only) items = items.filter(q => only.includes(q.name));
  const n = only || level.toets ? items.length : (level.boss ? 15 : ROUND);
  if(level.toets) return shuffle(items.flatMap(q => [{...q, type:"find"}, {...q, type:"name"}]));
  if(level.boss && !only) return shuffle(items.flatMap(q => [{...q, type:"find"}, {...q, type:"name"}])).slice(0, 15);
  return shuffle(items).slice(0, n).map(q => ({...q, type: Math.random()<0.6 ? "find" : "name"}));
}

function studyItems(){
  const R = REGIONS[region], all = [];
  if(!R.codes){

    R.provs.forEach(n => { const a = (R.provAt||{})[n] || provCenter(n); all.push({name:n, lat:a[0], lon:a[1], at:"center", group:"prov"}); });
    CAPITALS.filter(c => R.provs.includes(c.prov)).forEach(c => all.push({...c, group:"city"}));
    ISLANDS.filter(i => R.islands.includes(i.name)).forEach(i => all.push({...i, group:"island"}));
    all.forEach(it => { if(!it.at) it.at = (R.labelAt||{})[it.name] || "start"; });
    return all;
  }
  const C = R.codes;
  R.provs.forEach(n => { const a = (R.provAt||{})[n]; if(a && C[n]) all.push({name:n, lat:a[0], lon:a[1], at:a[2], group:"prov", code:C[n]}); });
  [...CAPITALS, ...CITIES, ...(R.places||[])].forEach(c => { if(C[c.name] && !all.some(x=>x.name===c.name))
    all.push({...c, group: c.type==="place" ? "place" : (+C[c.name] <= 4 ? "city" : "place"), code:C[c.name]}); });
  (R.water||[]).forEach(w => { if(C[w.name]) all.push({...w, group:"water", code:C[w.name]}); });
  all.forEach(it => { if(!it.at) it.at = (R.labelAt||{})[it.name] || "start"; });

}

      <div class="pips">${Object.keys(REGIONS).map(k=>`<span class="${done["toets-"+k]?"on":""}">${done["toets-"+k]?"✓ ":""}${rl(k)}</span>`).join("")}</div></div></div>
    <button class="big ghost cabbtn" id="cab" type="button">${TROPHY_SVG("","goud")}${t("cabBtn", shownACH().filter(a=>trophies[a.id]).length, shownACH().length)}</button>
    <button class="big ghost" id="shopBtn" type="button">${t("shopBtn", tokens())}</button>
    <button class="big ghost" id="petBtn" type="button">${t("petBtn")}</button>
    ${isAtlas() || isGold() ? "" : `<button class="big ghost" id="bouw" type="button">${t(isCrew()?"bouwCrew":isZen()?"bouwZen":"bouwBlok")}</button>`}
    <div class="qnum">${t("whichRegion")}</div>
    <div class="regions" role="group" aria-label="${t("regionAria")}">${Object.keys(REGIONS).map(k=>`<button class="reg" type="button" data-r="${k}" aria-pressed="${k===region}">${rl(k)}${done["toets-"+k]?" ✓":""}</button>`).join("")}</div>
    ${paused?`<button class="big" id="resume" type="button">${t("resume", paused.i+1, paused.qs.length)}</button>`:""}
    <button class="big ${paused?"ghost":""}" id="study" type="button">${t("studyBtn", rl(region))}</button>
    <div class="qnum">${t("chooseYour")}</div>    <p class="note">${t("rules")}</p>
    ${todo.length?"":`<div class="alldone">${t("allDone")}</div>`}
    <div class="levels">${all.map(btn).join("")}</div>`;
  card.querySelectorAll(".lvl").forEach(b => b.onclick = () => start(LEVELS[+b.dataset.i]));
  document.getElementById("cab").onclick = cabinet; document.getElementById("shopBtn").onclick = shop; document.getElementById("petBtn").onclick = petShop;
  const bw = document.getElementById("bouw"); if(bw) bw.onclick = builder;
  const sb = document.getElementById("study"); if(sb) sb.onclick = study;
  const rb = document.getElementById("resume"); if(rb) rb.onclick = resumeGame;
  card.querySelectorAll(".reg").forEach(b => b.onclick = () => { region = b.dataset.r; try{ localStorage.setItem("topo-region", region); }catch(e){} menu(); });
}
document.getElementById("themeBtn").onclick = () => { const TH = [...THEMES, ...MAPS.filter(m => inv()[m.id] > 0).map(m => m.theme)]; theme = TH[(TH.indexOf(theme)+1) % TH.length]; try{ localStorage.setItem("topo-theme", theme); }catch(e){}
  applyTheme(); if(building){ if(isAtlas() || isGold()) menu(); else drawBuild(); } else if(card.querySelector(".petshop")) petShop(); else if(card.querySelector(".shop")) shop(); else if(!G && !studying) menu(); };

document.getElementById("langBtn").onclick = () => { lang = lang==="en" ? "nl" : "en"; try{ localStorage.setItem("topo-lang", lang); }catch(e){}
  applyTheme();
  if(building) drawBuild();
  else if(studying){ const keep = studyOn; study(); if(keep) studyHL(keep); }
  else if(G && G.end) drawEnd();
  else if(G){ if(!G.lock) next(true); }
  else if(card.querySelector(".shelf")) cabinet();
  else if(card.querySelector(".petshop")) petShop(); else if(card.querySelector(".shop")) shop();
  else menu(); };

(() => { const wrapEl = document.querySelector(".wrap"), vv = window.visualViewport;
  const fit = () => { const typing = document.activeElement && document.activeElement.id==="wIn" && innerWidth<=760;
    wrapEl.classList.toggle("typing", !!typing);
    wrapEl.style.height = typing && vv ? vv.height+"px" : ""; if(typing) window.scrollTo(0,0); };
  if(vv) vv.addEventListener("resize", fit);
  document.addEventListener("focusin", fit); document.addEventListener("focusout", () => setTimeout(fit, 60)); })();

if(!location.hostname.endsWith("github.io") && !load("topo-gift1")){ save("topo-tokens", tokens() + 5); save("topo-gift1", true); }
if(!location.hostname.endsWith("github.io") && !load("topo-gift2")){ save("topo-tokens", tokens() + 1); save("topo-gift2", true); }
if(!location.hostname.endsWith("github.io") && !load("topo-gift3")){ save("topo-tokens", tokens() + 2); save("topo-gift3", true); }
if(!location.hostname.endsWith("github.io") && !load("topo-gift4")){ save("topo-tokens", tokens() + 17); save("topo-gift4", true); }
if(!location.hostname.endsWith("github.io") && !load("topo-gift5")){ save("topo-tokens", tokens() + 4); save("topo-gift5", true); }
applyTheme();
syncTrophies();
menu();
</script>
